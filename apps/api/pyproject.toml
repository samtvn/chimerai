[project]
name = "api"
version = "0.1.0"
description = "Chimerai FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.13.3",
    "requests>=2.33.1",
    "bs4>=0.0.2",
    "sqlmodel>=0.0.38",
    "uuid6>=2025.0.1",
    "pgvector<0.4.0",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.10",
    "psycopg[binary,pool]>=3.3.4",
    "langchain>=1.2.18",
    "langchain-google-genai>=4.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py313"
