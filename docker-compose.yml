services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chimerai
      POSTGRES_PASSWORD: chimerai
      POSTGRES_DB: chimerai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chimerai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
